<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d'),start=document.getElementById('start'),title=document.getElementById('title'),jump=document.getElementById('jump'),flash=document.getElementById('flash'),comfort=document.getElementById('comfort'),audio=document.getElementById('sfx');
let W=0,H=0,DPR=1,items=[],running=false,t0=0,jumped=false;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);makeHeart();}
function heart(x){return {x:16*Math.sin(x)**3,y:-(13*Math.cos(x)-5*Math.cos(2*x)-2*Math.cos(3*x)-Math.cos(4*x))}}
function makeHeart(){
 items=[];
 const cx=W/2, cy=H*.38, s=Math.min(W,H)/42;
 // Giống video: chủ yếu là một đường viền trái tim thưa, chỉ có vài chữ rải nhẹ bên trong.
 const outlineCount=Math.max(62, Math.min(92, Math.round(Math.min(W,H)/10)));
 for(let i=0;i<outlineCount;i++){
   const t=(i/outlineCount)*Math.PI*2 + (Math.random()-.5)*.045;
   const p=heart(t);
   const jitter=(Math.random()-.5)*1.7;
   items.push({
     tx:cx+p.x*s+jitter,
     ty:cy+p.y*s+jitter,
     x:cx+(Math.random()-.5)*W*.75,
     y:H+40+Math.random()*H*.35,
     delay:i*28+Math.random()*260,
     size:11+Math.random()*4,
     rot:(Math.random()-.5)*.08,
     text:i%4===0?'I love you':'Love You'
   });
 }
 // Một lớp rất mỏng bên trong để có chiều sâu như khung hình gốc, không lấp kín tim.
 const innerCount=Math.max(16, Math.min(28, Math.round(Math.min(W,H)/32)));
 for(let i=0;i<innerCount;i++){
   const t=Math.random()*Math.PI*2;
   const p=heart(t);
   const r=.62+Math.random()*.18;
   items.push({
     tx:cx+p.x*s*r,
     ty:cy+p.y*s*r,
     x:cx+(Math.random()-.5)*W*.6,
     y:H+30+Math.random()*H*.25,
     delay:600+i*45+Math.random()*300,
     size:9+Math.random()*3,
     rot:(Math.random()-.5)*.1,
     text:Math.random()<.5?'I love you':'Love You'
   });
 }
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function frame(now){
 if(!running)return;
 ctx.clearRect(0,0,W,H);
 const e=now-t0;
 for(const p of items){
   const q=Math.max(0,Math.min(1,(e-p.delay)/980));
   const a=ease(q);
   const x=p.x+(p.tx-p.x)*a;
   const y=p.y+(p.ty-p.y)*a;
   const fade=q<.12?q/.12:1;
   ctx.save();
   ctx.translate(x,y);
   ctx.rotate(p.rot);
   ctx.globalAlpha=Math.max(0,fade*.82);
   ctx.font=`600 ${p.size}px Arial, sans-serif`;
   ctx.textAlign='center';
   ctx.textBaseline='middle';
   ctx.shadowColor='#008cff';
   ctx.shadowBlur=8;
   ctx.fillStyle='#159cff';
   ctx.fillText(p.text,0,0);
   ctx.restore();
 }
 if(e>5600&&!jumped){jumped=true;doJump();}
 requestAnimationFrame(frame);
}
function doJump(){jump.classList.add('show','shake');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');audio.currentTime=0;audio.play().catch(()=>{});setTimeout(()=>{jump.classList.remove('shake');comfort.classList.add('show');},2600)}
start.addEventListener('click',()=>{start.classList.add('hide');running=true;t0=performance.now();audio.volume=1;requestAnimationFrame(frame);});addEventListener('resize',resize);resize();
})();
</script></body></html>
